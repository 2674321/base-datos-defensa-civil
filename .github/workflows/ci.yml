name: CI

on:
  push:
    branches: ['**']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Sintaxis JS — node --check en todos los .js del proyecto
        run: |
          fallos=0
          while IFS= read -r f; do
            node --check "$f" || { echo "ERROR de sintaxis: $f"; fallos=1; }
          done < <(find . -type f -name '*.js' -not -path './node_modules/*' -not -path '*Defensa Civil*')
          exit $fallos

      - name: Tests — ejecutar cada test_*.js
        run: |
          fallos=0
          while IFS= read -r t; do
            echo "== $t"
            node "$t" || { echo "TEST FALLIDO: $t"; fallos=1; }
          done < <(find . -type f -name 'test_*.js' -not -path './node_modules/*' -not -path '*Defensa Civil*')
          exit $fallos