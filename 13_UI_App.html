  /* ---- API backend: promesa sobre google.script.run ---- */

  function api(nombre, args) {
    return new Promise(function (resolver, rechazar) {
      var aviso = null;
      var t0 = Date.now();
      var ejecutar = function () {
        t0 = Date.now();
        google.script.run
          .withSuccessHandler(function (res) {
            if (aviso) { aviso.cerrar(); aviso = null; }
            // V3.4H: piso de 300ms para que los skeletons sean visibles
            // en llamadas rápidas (cache/memo). Solo aplica a server calls,
            // no a memo/read instantáneos.
            var elapsed = Date.now() - t0;
            if (elapsed < 300) {
              setTimeout(function () { resolver(res); }, 300 - elapsed);
            } else {
              resolver(res);
            }
          })
          .withFailureHandler(function (err) {
            console.error('[App] fallo de llamada: ' + nombre, err && err.message ? err.message : err);
            if (aviso) return;
            var cerrado = false;
            aviso = toast({
              tipo: 'error',
              titulo: 'No fue posible completar la operación',
              detalle: 'Comprueba tu conexión o vuelve a intentarlo.',
              accionTexto: 'Reintentar',
              auto: false,
              alAccion: function () { aviso = null; ejecutar(); },
              alCerrar: function () {
                if (cerrado) return;
                cerrado = true;
                rechazar(new Error('No fue posible completar la operación'));
              }
            });
          })
          [nombre].apply(null, args || []);
      };
      ejecutar();
    });
  }

  function pedir(nombre, args) {
    return api(nombre, args).then(function (res) {
      if (res && res.ok === false) {

      }
      return res && res.data !== undefined ? res.data : res;
    });
  }

      html += '<div class="skeleton-fila"><div class="skeleton" style="width:34px;height:34px;border-radius:50%"></div><div class="skeleton" style="flex:1"></div><div class="skeleton" style="width:80px"></div></div>';
    }
    el.innerHTML = html;
    contenedor.appendChild(el);
  }

  function skeletonTarjetas(contenedor, n, limpiar) {
    if (!contenedor) return;
    if (limpiar) contenedor.innerHTML = '';
    var viejo = contenedor.querySelector('.cargando, .skeleton-lista');
    if (viejo) viejo.remove();
    var el = document.createElement('div');
    el.className = 'skeleton-lista';
    var html = '';
    for (var i = 0; i < (n || 4); i++) {
      html += '<div class="skeleton-fila"><div class="skeleton" style="width:42px;height:42px;border-radius:12px"></div>' +
        '<div style="flex:1"><div class="skeleton" style="width:45%;height:16px"></div>' +
        '<div class="skeleton" style="width:70%;height:10px;margin-top:9px"></div></div>' +
        '<div class="skeleton" style="width:54px;height:22px;border-radius:999px"></div></div>';
    }
    el.innerHTML = html;
    contenedor.appendChild(el);
  }

  /* Estados de botón en operaciones asíncronas: Normal → Procesando (spinner) → Éxito (✓) / Error (reintentar). */
  function botonEstado(btn, estado, texto) {
    if (!btn) return;
    if (estado === 'procesando') {
      if (!btn.dataset.estadoOriginal) btn.dataset.estadoOriginal = btn.innerHTML;
      btn.dataset.estado = 'procesando';
      btn.disabled = true;
      btn.classList.add('btn-procesando');
      btn.innerHTML = '<span class="spinner-mini" aria-hidden="true"></span>' + h(texto || 'Procesando…');
    } else if (estado === 'exito') {
      btn.dataset.estado = 'exito';
      btn.disabled = true;
      btn.classList.remove('btn-procesando');
      btn.classList.add('btn-exito');
      btn.innerHTML = icono('check') + h(texto || 'Completada');
      var orig = btn.dataset.estadoOriginal;
      setTimeout(function () {
        if (btn.dataset.estado === 'exito') {
          btn.classList.remove('btn-exito');
          btn.disabled = false;
          btn.innerHTML = orig || btn.innerHTML;
          delete btn.dataset.estado;
        }
      }, 1600);
    } else {
      btn.disabled = false;
      btn.classList.remove('btn-procesando', 'btn-exito');
      if (btn.dataset.estadoOriginal) {
        btn.innerHTML = btn.dataset.estadoOriginal;
        delete btn.dataset.estadoOriginal;
      }
      delete btn.dataset.estado;
    }
  }

  var _splashInicio = Date.now();
  var SPLASH_MIN_MS = 1200;
  function ocultarSplash() {
    var sp = document.getElementById('splash');
    if (!sp || sp.classList.contains('saliendo')) return;
    var elapsed = Date.now() - _splashInicio;
    var restante = SPLASH_MIN_MS - elapsed;
    if (restante > 0) {
      setTimeout(function () { ocultarSplash(); }, restante);
      return;
    }
    sp.classList.add('saliendo');
    setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 320);
  }

  function badge(texto, tipo) {
    var ico = { 'ok': 'check', 'aviso': 'alerta', 'peligro': 'alerta' }[tipo] || 'punto';
    return '<span class="badge badge-' + h(tipo) + '">' + icono(ico) + h(texto) + '</span>';
  }

  function empty(iconoNombre, titulo, detalle, ctaHtml) {
    return '<div class="empty">' + icono(iconoNombre || 'paquete') +
      '<h3>' + h(titulo) + '</h3>' +
      (detalle ? '<p>' + h(detalle) + '</p>' : '') +
      (ctaHtml ? '<div class="mt-8">' + ctaHtml + '</div>' : '') +
      '</div>';
  }

  function alerta(tipo, html) {
    var ico = tipo === 'critica' ? 'alerta' : (tipo === 'aviso' ? 'alerta' : 'check');
    return '<div class="alerta alerta-' + h(tipo) + '" role="status">' + icono(ico) + '<div>' + html + '</div></div>';
  }

  var TIPOS_VOLUNTARIO = { 'Activo': 'ok', 'Inactivo': 'neutro', 'Suspendido': 'aviso', 'Egresado': 'gris' };
  var TIPOS_INVENTARIO = { 'Disponible': 'ok', 'Entregado': 'info', 'Dañado': 'peligro', 'Extraviado': 'aviso', 'Baja': 'gris' };
  var TIPOS_ENTREGA = {
    'Pendiente de devolución': 'info', 'Devuelto': 'ok', 'Devuelto parcial': 'info2',
    'Dañado': 'peligro', 'Extraviado': 'aviso', 'Entregado': 'neutro'
  };

  function estadoVoluntario(e) { return badge(e, TIPOS_VOLUNTARIO[e] || 'neutro'); }
  function estadoInventario(e) { return badge(e, TIPOS_INVENTARIO[e] || 'neutro'); }
  function estadoEntrega(e) { return badge(e, TIPOS_ENTREGA[e] || 'neutro'); }

  function iniciales(nombre) {
    var p = String(nombre || '').trim().split(/\s+/);
    return ((p[0] || '').charAt(0) + (p[1] || '').charAt(0)).toUpperCase() || '?';
  }

  /* ---- Modal con foco y Esc ---- */

  var ultimoFoco = null;

  function modal(opciones) {
    var raiz = document.getElementById('modal-root');
    raiz.innerHTML = '';
    ultimoFoco = document.activeElement;
    var over = document.createElement('div');
    over.className = 'modal-overlay';
    var cuerpo = document.createElement('div');
    cuerpo.className = 'modal-cuerpo';
    var cerrado = false;
    var cerrar = function () {
      if (cerrado) return;
      cerrado = true;
      over.classList.add('saliendo');
      setTimeout(function () {
        if (over.parentNode) over.parentNode.removeChild(over);
        if (ultimoFoco && ultimoFoco.focus) ultimoFoco.focus();
      }, 170);
    };
    over.innerHTML =
      '<div class="modal" role="dialog" aria-modal="true"' +
      (opciones.titulo ? ' aria-labelledby="modal-titulo"' : '') + '>' +
      '<div class="modal-cabecera"><h3 id="modal-titulo">' + h(opciones.titulo || '') + '</h3>' +
      '<button class="btn-icono" data-cerrar="1" aria-label="Cerrar">' + icono('x') + '</button></div>' +
      '</div>';
    var mod = over.querySelector('.modal');
    if (opciones.ancho) mod.classList.add(opciones.ancho === 'ancho' ? 'modal-ancho' : '');
    mod.appendChild(cuerpo);
    if (opciones.acciones) {
      var pie = document.createElement('div');
      pie.className = 'modal-pie';
      pie.innerHTML = opciones.acciones;
      mod.appendChild(pie);
    }
    over.querySelector('[data-cerrar]').addEventListener('click', cerrar);
    // V3.4G: cierre global por delegación — el botón de pie `data-cerrar-form`
    // (Cancelar) de los modales con formulario cierra el modal SIN necesidad de
    // que cada página lo enlace (32_UI_Biblioteca no lo enlazaba → Cerrar no
    // hacía nada). Los bindings por página quedan inofensivos (cerrar idempotente).
    over.addEventListener('click', function (ev) {
      if (ev.target && ev.target.closest && ev.target.closest('[data-cerrar-form]')) cerrar();
    });
    over.addEventListener('mousedown', function (ev) { if (ev.target === over) cerrar(); });
    document.addEventListener('keydown', function esc(ev) {
      if (ev.key === 'Escape' && over.parentNode) { cerrar(); document.removeEventListener('keydown', esc); }
    });
    raiz.appendChild(over);
    cuerpo.innerHTML = opciones.cuerpo || '';
    var foco = mod.querySelector('input, select, textarea, button, [tabindex]');
    if (foco) setTimeout(function () { foco.focus(); }, 30);
    return { cerrar: cerrar, cuerpo: cuerpo, overlay: over };
  }

  function confirmar(opciones) {
    return new Promise(function (resolver) {
      var m = modal({
        titulo: opciones.titulo || 'Confirmar',
        cuerpo: '<p style="margin:0;font-size:13px">' + h(opciones.mensaje || '') + '</p>',
        acciones:
          '<button class="btn btn-secundario" data-accion="no">Cancelar</button>' +
          '<button class="btn ' + (opciones.tipo === 'peligro' ? 'btn-rojo' : 'btn-primario') + '" data-accion="si">' + h(opciones.confirmar || 'Confirmar') + '</button>'
      });
      m.overlay.querySelectorAll('[data-accion]').forEach(function (b) {
        b.addEventListener('click', function () { m.cerrar(); resolver(b.getAttribute('data-accion') === 'si'); });
      });
    });
  }

  /* ---- Dropdown ---- */

  function dropdown(disparador, itemsHtml) {
    var existente = disparador.parentNode.querySelector('.menu-desplegable');
    if (existente) { existente.remove(); return; }
    var menu = document.createElement('div');
    menu.className = 'menu-desplegable abierto';
    menu.setAttribute('role', 'menu');
    menu.innerHTML = itemsHtml;
    disparador.parentNode.appendChild(menu);
    function fuera(ev) {
      if (!menu.contains(ev.target) && ev.target !== disparador && !disparador.contains(ev.target)) {
        menu.remove();
        document.removeEventListener('mousedown', fuera);
      }
    }
    setTimeout(function () { document.addEventListener('mousedown', fuera); }, 10);
  }

  /* ---- Router con parámetros ---- */

  function registrarPagina(nombre, modulo) { PAGINAS[nombre] = modulo; }

  function navegar(nombre, params) {
    if (!PAGINAS[nombre]) { nombre = 'dashboard'; params = null; }
    var navRuta = nombre === 'ficha' ? 'voluntarios' : nombre;
    var items = document.querySelectorAll('.nav-item[data-ruta]');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('activo', items[i].getAttribute('data-ruta') === navRuta);
    }
    for (var gi = 0; gi < items.length; gi++) {
      if (items[gi].getAttribute('data-ruta') === navRuta) {
        var gr = items[gi].closest('.nav-grupo-exp');
        if (gr && !gr.classList.contains('abierto')) {
          gr.classList.add('abierto');
          var btnGr = gr.querySelector('.nav-item');
          if (btnGr) btnGr.setAttribute('aria-expanded', 'true');
        }
        break;
      }
    }
    var paginas = document.querySelectorAll('.page');
    var aplicar = function () {
      if (_barraCarga) { _barraCarga.style.width = '100%'; }
      for (var j = 0; j < paginas.length; j++) {
        var esActiva = paginas[j].id === 'page-' + nombre;
        paginas[j].classList.remove('saliendo');
        paginas[j].classList.toggle('activa', esActiva);
        paginas[j].hidden = !esActiva;
      }
      var titulo = document.getElementById('seccion-actual');
      if (titulo && TITULOS[nombre]) titulo.textContent = TITULOS[nombre];
      var hash = '#/' + nombre + (params && params.id !== undefined && !isNaN(params.id) ? '/' + params.id : '');
      try { history.replaceState(null, '', hash); } catch (err) {}
      var cont = document.getElementById('page-' + nombre);
      var mod = PAGINAS[nombre];
      if (mod && cont) {
        App.cargando(cont, false);
        try {
          mod.init(cont, params || {});
        } catch (err) {
          console.error('Error en página ' + nombre, err);
          cont.innerHTML = App.alerta('critica', '<strong>Error al cargar la página.</strong> ' + App.h(err && err.message ? err.message : err));
        }
        if (!cont.__v34Vista) {
          cont.__v34Vista = true;
          cont.classList.add('vista-nueva');
          setTimeout(function () { cont.classList.remove('vista-nueva'); }, 700);
        }
      }
      window.scrollTo(0, 0);
      setTimeout(function () { if (_barraCarga) { _barraCarga.style.width = '0'; } }, 100);
    };
    var vieja = null;
    for (var k = 0; k < paginas.length; k++) {
      if (paginas[k].classList.contains('activa') && paginas[k].id !== 'page-' + nombre) { vieja = paginas[k]; break; }
    }
    var reducido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (vieja && !reducido) {
      if (_barraCarga) { _barraCarga.style.width = '60%'; _barraCarga.style.transition = 'width 150ms ease-out'; }
      vieja.classList.add('saliendo');
      setTimeout(aplicar, 150);
    } else {
      aplicar();
    }
  }

  function rutaActual() {
    var partes = (location.hash || '').replace(/^#\//, '').split('/');
    return { nombre: partes[0] || 'dashboard', params: partes[1] !== undefined ? { id: parseInt(partes[1], 10) } : {} };
  }

  /* ---- Alertas del sidebar/campana (alimentadas por el agregador, sin consultas extra) ---- */

  function refrescarAlertas() {
    return memo('dashboard', 30000, function () {
      return pedir('obtenerResumenDashboardV2');
    }).then(function (d) {
      var total = d.resumenAlerta ? d.resumenAlerta.total : 0;
      var criticas = d.resumenAlerta ? d.resumenAlerta.criticas : 0;
      var badge = document.getElementById('nav-alertas');
      var bell = document.getElementById('bell-alertas');
      var set = function (el, gris) {
        if (!el) return;
        if (total > 0) {
          el.textContent = total;
          el.classList.remove('oculta');
          el.classList.toggle('gris', gris);
          if (ultimoTotalAlertas !== null && ultimoTotalAlertas !== total) {
            el.classList.remove('pulso');
            void el.offsetWidth;
            el.classList.add('pulso');
          }
        } else {
          el.classList.add('oculta');
        }
      };
      set(badge, criticas === 0);
      set(bell, criticas === 0);
      ultimoTotalAlertas = total;
      var ver = document.getElementById('app-version');
      if (ver && d.version) ver.textContent = d.version;
      return d;
    }).catch(function () { return null; });
  }

  function trasCambio() {
    invalidar('dashboard');
    refrescarAlertas();
  }

  /* ---- Manejador de errores global: nunca una página en blanco silenciosa ---- */

  function mostrarErrorGlobal(mensaje) {
    var banner = document.getElementById('banner-error');
    var texto = document.getElementById('banner-error-texto');
    if (!banner) return;
    if (texto && mensaje) texto.textContent = 'Ocurrió un error inesperado: ' + String(mensaje).slice(0, 160);
    banner.classList.add('visible');
    setTimeout(function () { banner.classList.remove('visible'); }, 8000);
  }

  /* ---- Arranque ---- */

  function iniciar() {
    window.addEventListener('error', function (ev) {
      mostrarErrorGlobal(ev.message || 'error de ejecución');
    });
    window.addEventListener('unhandledrejection', function (ev) {
      mostrarErrorGlobal(ev.reason && ev.reason.message ? ev.reason.message : 'error asíncrono');
    });

    var logos = document.querySelectorAll('.logo-institucional');
    for (var li = 0; li < logos.length; li++) { logos[li].src = LOGO; }

    _barraCarga = document.createElement('div');
    _barraCarga.style.cssText = 'position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--dc-azul-500,#004C90),var(--dc-celeste-500,#0B92E0));z-index:10000;transition:width 200ms ease-out;pointer-events:none;';
    document.body.appendChild(_barraCarga);

    var items = document.querySelectorAll('.nav-item[data-ruta]');
    for (var i = 0; i < items.length; i++) {
      items[i].addEventListener('click', function (ev) {
        ev.preventDefault();
        var r = this.getAttribute('data-ruta');
        if (r) navegar(r);
      });
    }

    var btnMenu = document.getElementById('btn-menu');
    var sidebar = document.getElementById('sidebar');
    var grupos = document.querySelectorAll('.nav-grupo-exp');
    for (var gi = 0; gi < grupos.length; gi++) {
      (function (grupo) {
        var btn = grupo.querySelector('.nav-item');
        if (!btn) return;
        btn.addEventListener('click', function () {
          var abierto = grupo.classList.toggle('abierto');
          btn.setAttribute('aria-expanded', abierto ? 'true' : 'false');
        });
      })(grupos[gi]);
    }
    if (btnMenu && sidebar) {
      btnMenu.addEventListener('click', function () {
        var abierta = sidebar.classList.toggle('abierta');
        btnMenu.setAttribute('aria-expanded', abierta ? 'true' : 'false');
        var ov = document.querySelector('.overlay-movil');
        if (abierta && !ov) {
          var overlay = document.createElement('div');
          overlay.className = 'overlay-movil';
          overlay.addEventListener('click', function () { sidebar.classList.remove('abierta'); overlay.remove(); btnMenu.setAttribute('aria-expanded', 'false'); });
          document.body.appendChild(overlay);
        } else if (!abierta && ov) { ov.remove(); }
      });
      sidebar.querySelectorAll('.nav-item').forEach(function (el) {
        el.addEventListener('click', function () {
          if (window.innerWidth <= 900) {
            sidebar.classList.remove('abierta');
            btnMenu.setAttribute('aria-expanded', 'false');
            var ov2 = document.querySelector('.overlay-movil');
            if (ov2) ov2.remove();
          }
        });
      });
    }

    var bell = document.getElementById('btn-alertas');
    if (bell) {
      // V3.4C: la campana abre el PANEL de alertas (datos ya cacheados por el
      // agregador, sin consultas extra). Cerrar el panel NO marca las alertas
      // como leídas: el contador persiste hasta que la alerta se resuelve.
      bell.addEventListener('click', function () {
        refrescarAlertas().then(function (d) {
          if (!d) { toast('No fue posible cargar las alertas.', 'error'); return; }
          var alertas = d.alertas || [];
          var items = '';
          for (var i = 0; i < alertas.length; i++) {
            var a = alertas[i];
            items += '<div class="menu-item alr-item' + (a.severidad === 'critica' ? ' alr-critica' : '') + '">' +
              icono(a.severidad === 'critica' ? 'alerta' : 'punto') + '<span>' + h(a.texto) + '</span></div>';
          }
          items = '<div class="menu-desplegable alr-lista">' +
            (items || '<div class="menu-item" style="pointer-events:none">Sin alertas.</div>') +
            '<div class="menu-separador"></div>' +
            '<div class="menu-item alr-ver-todas">' + icono('dashboard') + '<span>Ver panel de control</span></div>' +
            '</div>';
          dropdown(bell, items);
          // V3.4D: ABRIR ≠ LEER ≠ ELIMINAR. Solo "Ver panel de control"
          // navega; los ítems de alerta son de lectura (no redirigen).
          var verTodas = bell.parentNode.querySelector('.alr-lista .alr-ver-todas');
          if (verTodas) {
            verTodas.addEventListener('click', function () { navegar('dashboard'); });
          }
        });
      });
    }

    var usuario = document.getElementById('usuario-boton');
    if (usuario) {
      usuario.addEventListener('click', function () {
        dropdown(usuario,
          '<div class="menu-item" style="pointer-events:none;font-weight:600">' + h(sesion ? sesion.nombre : '…') + '</div>' +
          '<div class="menu-item" style="pointer-events:none;font-size:11px;color:var(--texto-3)">' + h(sesion ? sesion.correo : '') + '</div>' +
          '<div class="menu-separador"></div>' +
          '<div class="menu-item" style="pointer-events:none">' + icono('historial') + ' Versión ' + h(PROYECTO_VERSION) + '</div>');
      });
    }

    var pSesion = pedir('getSesion').then(function (s) {
      sesion = s;
      if (s.version) PROYECTO_VERSION = s.version;
      var el = document.getElementById('usuario-nombre');
      var avatar = document.getElementById('usuario-avatar');
      var dot = document.getElementById('usuario-dot');
      if (el) el.textContent = s.nombre;
      if (avatar) avatar.textContent = (s.nombre || '?').charAt(0).toUpperCase();
      if (dot) dot.title = s.correo || 'Sesión de Google';
      if (!s.correo) toast('Sesión anónima: revisa el acceso del deployment', 'aviso');
    }).catch(function () {});

    var pAlertas = refrescarAlertas();
    var r = rutaActual();
    navegar(r.nombre, r.params);

    window.addEventListener('hashchange', function () {
      var r2 = rutaActual();
      navegar(r2.nombre, r2.params);
    });

    Promise.all([pSesion, pAlertas]).then(ocultarSplash, ocultarSplash);
    setTimeout(ocultarSplash, 6000);
  }

  return {
    api: api,
    pedir: pedir,
    memo: memo,
    invalidar: invalidar,
    h: h,
    debounce: debounce,
    icono: icono,
    toast: toast,
    cargando: cargando,
    skeleton: skeleton,
    skeletonTarjetas: skeletonTarjetas,
    botonEstado: botonEstado,
    badge: badge,
    empty: empty,
    alerta: alerta,
    estadoVoluntario: estadoVoluntario,
    estadoInventario: estadoInventario,
    estadoEntrega: estadoEntrega,
    iniciales: iniciales,
    modal: modal,
    confirmar: confirmar,
    dropdown: dropdown,
    registrarPagina: registrarPagina,
    navegar: navegar,
    rutaActual: rutaActual,
    refrescarAlertas: refrescarAlertas,
    trasCambio: trasCambio,
    iniciar: iniciar,
    sesion: function () { return sesion; },
    patch: function (nombre, alt) {
      return typeof App.patch === 'function' ? App.patch(nombre, alt) : '';
    },
    LOGO: LOGO
  };
})();

document.addEventListener('DOMContentLoaded', function () { App.iniciar(); });</script>
