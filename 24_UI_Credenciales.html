<script>/* ============ PÁGINA: CREDENCIALES (V2) ============
   Catálogo de credenciales + asignación a voluntarios + vencimientos
   (backend 25_Credenciales.js). */

var CredencialesModule = (function () {
  'use strict';
  var cont = null;
  var lista = [];
  var pestaña = 'catalogo';

  function cargar() {
    App.pedir('listarCredencialesV2').then(function (res) {
      lista = res || [];
      render();
    }).catch(function (err) {
      cont.innerHTML = App.alerta('critica', '<strong>No se pudieron cargar las credenciales.</strong> ' + App.h(err.message || err));
    });
  }

  function render() {
    cont.innerHTML = '';
    var cabecera = document.createElement('div');
    cabecera.className = 'page-cabecera';
    cabecera.innerHTML =
      '<div><h1 class="page-titulo">Credenciales</h1>' +
      '<p class="page-sub">Catálogo de credenciales, asignaciones a voluntarios y vencimientos</p></div>';
    cont.appendChild(cabecera);

    var tabs = document.createElement('div');
    tabs.className = 'tabs';
    tabs.innerHTML =
      '<button class="tab" data-tab="catalogo">Catálogo (' + lista.length + ')</button>' +
      '<button class="tab" data-tab="venc">Vencimientos</button>' +
      '<button class="tab" data-tab="asig">Por voluntario</button>';
    cont.appendChild(tabs);
    tabs.querySelectorAll('.tab').forEach(function (b) {
      b.addEventListener('click', function () {
        pestaña = b.getAttribute('data-tab');
        tabs.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('activa'); });
        b.classList.add('activa');
        pintar();
      });
    });
    pintar();
  }

  function pintar() {
    var anterior = cont.querySelector('.card');
    if (anterior) anterior.remove();
    var card = document.createElement('div');
    card.className = 'card';
    cont.appendChild(card);

    if (pestaña === 'catalogo') {
      // V3.4H: el catálogo es la PLANTA de tipos de licencia — solo
      // Nombre, Emisor y Estado (Activo/Inactivo). N°/fechas/observaciones
      // viven en la asignación (por voluntario), nunca aquí.
      card.innerHTML =
        '<div class="card-cabecera"><strong>Catálogo</strong>' +
        '<span class="texto-dim">Planta de tipos de licencia (la vigencia y los datos de cada licencia se registran en la asignación al voluntario)</span>' +
        '<button class="btn btn-primario" id="cr-nuevo">' + App.icono('mas') + 'Nueva credencial</button></div>' +
        '<div class="card-cuerpo sin-pad">' +
        '<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Credencial</th><th>Emisor</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>' +
        lista.map(function (c) {
          var badgeEstado = { 'Activo': 'ok', 'Inactivo': 'gris' };
          return '<tr><td class="fuerte">' + App.h(c.nombre) + '</td>' +
            '<td>' + App.h(c.emisor || '—') + '</td>' +
            '<td>' + App.badge(c.estado, badgeEstado[c.estado] || 'neutro') + '</td>' +
            '<td><div class="acciones">' +
            '<button class="btn-icono" data-cr-edit="' + App.h(c.id) + '" title="Editar" aria-label="Editar">' + App.icono('editar') + '</button>' +
            '<button class="btn-icono" data-cr-asig="' + App.h(c.id) + '" title="Asignar a voluntario" aria-label="Asignar">' + App.icono('voluntarios') + '</button>' +
            '</div></td></tr>';
        }).join('') +
        '</tbody></table></div></div>';
      document.getElementById('cr-nuevo').addEventListener('click', formCatalogo(null));
      card.querySelectorAll('[data-cr-edit]').forEach(function (b) {
        b.addEventListener('click', function () {
          var item = lista.find(function (c) { return c.id === this.getAttribute('data-cr-edit'); }, b);
          if (item) formCatalogo(item)();
        });
      });
      card.querySelectorAll('[data-cr-asig]').forEach(function (b) {
        b.addEventListener('click', function () {
          var item = lista.find(function (c) { return c.id === this.getAttribute('data-cr-asig'); }, b);
          if (item) formAsignar(item);
        });
      });
      return;
    }

    if (pestaña === 'venc') {
      card.innerHTML = '<div class="card-cabecera"><strong>Vencimientos</strong><span class="texto-dim">Credenciales vencidas o por vencer (umbral configurable)</span></div>' +
        '<div class="card-cuerpo" id="cr-venc-cuerpo"></div>';
      App.pedir('obtenerVencimientosV2').then(function (res) {
        var items = res || [];
        var cuerpo = document.getElementById('cr-venc-cuerpo');
        if (!cuerpo) return;
        if (!items.length) { cuerpo.innerHTML = App.empty('check', 'Sin vencimientos', 'No hay credenciales vencidas ni por vencer.'); return; }
        cuerpo.innerHTML = '<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Voluntario</th><th>Credencial</th><th>Vencimiento</th><th>Estado</th></tr></thead><tbody>' +
          items.map(function (x) {
            return '<tr><td class="fuerte">' + App.h(x.voluntario) + '</td>' +
              '<td>' + App.h(x.credencial) + '</td>' +
              '<td>' + App.h(x.fechaVencimiento || '—') + '</td>' +
              '<td>' + App.badge(x.estado, x.estado === 'Vencida' ? 'rojo' : 'aviso') + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }).catch(function (err) {
        var cuerpo = document.getElementById('cr-venc-cuerpo');
        if (cuerpo) cuerpo.innerHTML = App.alerta('critica', '<strong>No se pudieron cargar los vencimientos.</strong> ' + App.h(err.message || err));
      });
      return;
    }

    card.innerHTML =
      '<div class="card-cabecera"><strong>Credenciales por voluntario</strong></div>' +
      '<div class="card-cuerpo"><div class="campo-fila">' +
      '<div class="campo"><label for="cr-vol">Voluntario N°</label><input class="input" id="cr-vol" placeholder="Ej.: 3"></div>' +
      '<button class="btn btn-secundario" id="cr-vol-ver">' + App.icono('documento') + 'Ver credenciales</button></div>' +
      '<div id="cr-vol-resultado" style="margin-top:var(--esp-3)"></div></div>';
    document.getElementById('cr-vol-ver').addEventListener('click', verPorVoluntario);
    document.getElementById('cr-vol').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') verPorVoluntario();
    });
  }

  function verPorVoluntario() {
    var vol = document.getElementById('cr-vol').value.trim();
    var caja = document.getElementById('cr-vol-resultado');
    if (!vol) { caja.innerHTML = ''; return; }
    caja.innerHTML = '<div class="skeleton" style="height:56px"></div>';
    App.pedir('listarCredencialesVoluntarioV2', [vol]).then(function (res) {
      var items = res || [];
      var badgeEstado = { 'Vigente': 'ok', 'Por vencer': 'aviso', 'Vencida': 'rojo' };
      caja.innerHTML = '<div class="alerta alerta-info" role="status">' + App.icono('alerta') +
        '<div><strong>Vol. ' + App.h(vol) + '</strong> — ' + items.length + ' credencial(es) asignada(s)' +
        '<div style="margin-top:var(--esp-2)"><button class="btn btn-primario" id="cr-asig-nueva">' + App.icono('mas') + 'Asignar credencial</button></div></div></div>' +
        (items.length ?
          '<div class="tabla-wrap" style="margin-top:var(--esp-3)"><table class="tabla"><thead><tr><th>Credencial</th><th>Emisor</th><th>Obtención</th><th>Estado</th><th style="text-align:right">Acciones</th></tr></thead><tbody>' +
          items.map(function (x) {
            return '<tr><td class="fuerte">' + App.h(x.nombre) + '</td>' +
              '<td>' + App.h(x.emisor || '—') + '</td>' +
              '<td>' + App.h(x.fechaObtencion || '—') + '</td>' +
              '<td>' + App.badge(x.estado, badgeEstado[x.estado] || 'neutro') + '</td>' +
              '<td><div class="acciones"><button class="btn-icono btn-icono-rojo" data-cr-del="' + App.h(x.id) + '" title="Revocar credencial" aria-label="Revocar credencial">' + App.icono('x') + '</button></div></td></tr>';
          }).join('') +
          '</tbody></table></div>' : '');
      document.getElementById('cr-asig-nueva').addEventListener('click', function () {
        formAsignar(null, vol);
      });
      caja.querySelectorAll('[data-cr-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          var id = b.getAttribute('data-cr-del');
          App.confirmar({ titulo: 'Revocar credencial', mensaje: 'Esta acción no eliminará el registro histórico. La credencial quedará revocada y permanecerá en el historial del voluntario.', confirmar: 'Revocar', tipo: 'peligro' }).then(function (si) {
            if (!si) return;
            App.pedir('quitarCredencialV2', [id]).then(function () {
              App.toast('Credencial revocada', 'ok');
              verPorVoluntario();
            }).catch(function (err) { App.toast(err.message || 'No se pudo revocar', 'error'); });
          });
        });
      });
    }).catch(function (err) {
      caja.innerHTML = App.alerta('critica', '<strong>No se pudieron cargar las credenciales.</strong> ' + App.h(err.message || err));
    });
  }

  function formCatalogo(item) {
    return function () {
      var esNuevo = !item;
      var m = App.modal({
        titulo: esNuevo ? 'Nueva credencial' : 'Editar credencial: ' + App.h(item.nombre),
        cuerpo: '<div class="campo"><label for="cr-f-nombre">Nombre *</label><input class="input" id="cr-f-nombre" value="' + App.h(item ? item.nombre : '') + '"></div>' +
          '<div class="campo"><label for="cr-f-emisor">Emisor</label><input class="input" id="cr-f-emisor" value="' + App.h(item ? item.emisor : '') + '"></div>' +
          '<div class="campo"><label for="cr-f-estado">Estado</label><select class="select" id="cr-f-estado">' +
          ['Activo', 'Inactivo'].map(function (e) {
            return '<option' + (item && item.estado === e ? ' selected' : '') + '>' + e + '</option>';
          }).join('') + '</select></div>' +
          '<p class="texto-dim" style="margin-top:var(--esp-2)">Los datos de cada licencia (N°, vigencia, distintivo, nivel, modelos) se registran al asignarla a un voluntario.</p>',
        acciones: '<button class="btn btn-secundario" data-cerrar-form="1">Cancelar</button>' +
          '<button class="btn btn-primario" id="cr-f-guardar">' + App.icono('check') + (esNuevo ? 'Crear' : 'Guardar') + '</button>'
      });
      m.overlay.querySelector('[data-cerrar-form]').addEventListener('click', m.cerrar);
      document.getElementById('cr-f-guardar').addEventListener('click', function () {
        var btn = document.getElementById('cr-f-guardar');
        btn.disabled = true;
        var datos = {
          nombre: document.getElementById('cr-f-nombre').value,
          emisor: document.getElementById('cr-f-emisor').value,
          estado: document.getElementById('cr-f-estado').value
        };
        App.pedir(esNuevo ? 'crearCredencialV2' : 'actualizarCredencialV2', esNuevo ? [datos] : [item.id, datos]).then(function () {
          m.cerrar();
          App.toast(esNuevo ? 'Credencial creada' : 'Credencial actualizada', 'ok');
          cargar();
        }).catch(function (err) {
          btn.disabled = false;
          App.toast(err.message || 'No se pudo guardar', 'error');
        });
      });
    };
  }

  function formAsignar(item, voluntarioFijo) {
    var cred = item;
    var m = App.modal({
      titulo: 'Asignar credencial',
      cuerpo: '<div class="campo"><label for="cr-a-vol">Voluntario N°</label><input class="input" id="cr-a-vol" value="' + App.h(voluntarioFijo || '') + '" placeholder="Ej.: 3"></div>' +
        (!cred ?
          '<div class="campo"><label for="cr-a-cred">Credencial</label><select class="select" id="cr-a-cred">' +
          lista.map(function (c) { return '<option value="' + App.h(c.id) + '">' + App.h(c.nombre) + '</option>'; }).join('') +
          '</select></div>' : '') +
        '<div class="campo"><label for="cr-a-fecha">Fecha de obtención (dd/mm/aaaa)</label><input class="input" id="cr-a-fecha"></div>' +
        '<div class="campo"><label for="cr-a-estado">Estado</label><select class="select" id="cr-a-estado">' +
        ['Vigente', 'Por vencer', 'Vencida'].map(function (e) { return '<option>' + e + '</option>'; }).join('') + '</select></div>' +
        '<div class="campo"><label for="cr-a-nivel">Nivel (radioaficionado)</label><select class="select" id="cr-a-nivel"><option value="">— Sin nivel —</option>' +
        ['Aspirante', 'Novicio', 'General'].map(function (n) { return '<option>' + n + '</option>'; }).join('') + '</select></div>' +
        '<div class="campo"><label for="cr-a-modelos">Habilitaciones RPAS (separadas por ;)</label><input class="input" id="cr-a-modelos" placeholder="Ej.: MAVIC SERIES; MINI 2"></div>' +
        '<div class="campo"><label for="cr-a-obs">Observaciones</label><textarea class="textarea" id="cr-a-obs" rows="2"></textarea></div>',
      acciones: '<button class="btn btn-secundario" data-cerrar-form="1">Cancelar</button>' +
        '<button class="btn btn-primario" id="cr-a-guardar">' + App.icono('check') + 'Asignar</button>'
    });
    m.overlay.querySelector('[data-cerrar-form]').addEventListener('click', m.cerrar);
    document.getElementById('cr-a-guardar').addEventListener('click', function () {
      var btn = document.getElementById('cr-a-guardar');
      var vol = document.getElementById('cr-a-vol').value.trim();
      var credId = cred ? cred.id : document.getElementById('cr-a-cred').value;
      if (!vol) { App.toast('Indica el N° de voluntario', 'aviso'); return; }
      if (!credId) { App.toast('Selecciona una credencial', 'aviso'); return; }
      btn.disabled = true;
      App.pedir('asignarCredencialV2', [vol, credId, {
        fechaObtencion: document.getElementById('cr-a-fecha').value,
        estado: document.getElementById('cr-a-estado').value,
        nivel: document.getElementById('cr-a-nivel').value,
        modelosHabilitados: document.getElementById('cr-a-modelos').value,
        observaciones: document.getElementById('cr-a-obs').value
      }]).then(function () {
        m.cerrar();
        App.toast('Credencial asignada', 'ok');
        App.trasCambio();
        if (voluntarioFijo) verPorVoluntario();
        else cargar();
      }).catch(function (err) {
        btn.disabled = false;
        App.toast(err.message || 'No se pudo asignar', 'error');
      });
    });
  }

  return {
    init: function (contenedor) {
      cont = contenedor;
      App.skeleton(cont, 5);
      cargar();
    }
  };
})();

App.registrarPagina('credenciales', CredencialesModule);</script>
